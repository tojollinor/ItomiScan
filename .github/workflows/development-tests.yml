name: ItomiScan development checks

on:
  push:
    branches:
      - develop/1.0.0
  workflow_dispatch:

concurrency:
  group: itomiscan-development-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install lightweight GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk python3-pil python3-pil.imagetk fonts-dejavu-core xvfb xauth
      - name: Python syntax
        run: /usr/bin/python3 -m compileall -q app.py itomiscan tests
      - name: Shell syntax
        run: bash -n setup-updater.sh install-beta.sh install.sh setup-shutdown.sh setup-boot-splash.sh restore-boot-splash.sh inspect-boot-graphics.sh setup-web.sh setup-delivery.sh setup-printing.sh release-check.sh release-preflight.sh release-switch.sh
      - name: Offline configuration, startup and package tests
        run: |
          /usr/bin/python3 -m unittest discover -s tests -p test_beta_updater.py -v
          /usr/bin/python3 -m unittest discover -s tests -p test_beta_checker.py -v
          /usr/bin/python3 -m unittest discover -s tests -p test_block5_vnc_integration.py -v
          /usr/bin/python3 -m unittest discover -s tests -p test_vnc_bridge.py -v
          /usr/bin/python3 -m unittest discover -s tests -p test_branding.py -v
          /usr/bin/python3 -m unittest discover -s tests -p test_boot_optimization.py -v
          /usr/bin/python3 -m unittest discover -s tests -p test_system_status.py -v
          /usr/bin/python3 -m unittest discover -s tests -p test_profiles.py -v
          /usr/bin/python3 -m unittest discover -s tests -p test_users.py -v
          /usr/bin/python3 -m unittest discover -s tests -p test_delivery.py -v
          /usr/bin/python3 -m unittest discover -s tests -p test_printing.py -v
          /usr/bin/python3 -m unittest discover -s tests -p test_release_preflight.py -v
          /usr/bin/python3 -m unittest discover -s tests -p test_full_backup.py -v
          /usr/bin/python3 -m unittest discover -s tests -p test_startup.py -v
          /usr/bin/python3 -m unittest discover -s tests -p test_scaffold.py -v
      - name: Touchscreen smoke tests in isolated X process
        run: |
          timeout --signal=TERM --kill-after=10s 180s xvfb-run -a /usr/bin/python3 -u -m unittest discover -s tests -p test_touch_ui.py -v
          timeout --signal=TERM --kill-after=10s 180s xvfb-run -a /usr/bin/python3 -u -m unittest discover -s tests -p test_gui_smoke.py -v
      - name: Web administration security tests in separate process
        run: /usr/bin/python3 -m unittest discover -s tests -p test_web.py -v
