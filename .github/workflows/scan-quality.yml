name: ItomiScan scan quality

on:
  push:
    branches:
      - develop/1.0.0
  pull_request:
    branches:
      - develop/1.0.0
  workflow_dispatch:

concurrency:
  group: itomiscan-scan-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q app.py itomiscan tests
      - name: Install GUI and image test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk xvfb xauth
          python -m pip install --upgrade pip
          python -m pip install Pillow
      - name: Run headless regression tests separately
        run: |
          for test in tests/test_*.py; do
            case "$test" in *test_gui_smoke.py|*test_touch_ui.py) continue ;; esac
            timeout --signal=TERM --kill-after=10s 180s python -u -m unittest discover -s tests -p "$(basename "$test")" -v
          done
      - name: Run GUI regression tests in isolated virtual displays
        run: |
          timeout --signal=TERM --kill-after=10s 180s xvfb-run -a python -u -m unittest discover -s tests -p test_gui_smoke.py -v
          timeout --signal=TERM --kill-after=10s 180s xvfb-run -a python -u -m unittest discover -s tests -p test_touch_ui.py -v
      - name: Validate shell script syntax
        run: |
          bash -n setup-boot-splash.sh
          bash -n install-beta.sh
