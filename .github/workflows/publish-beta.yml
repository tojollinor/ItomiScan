name: Publish ItomiScan beta prerelease
on:
  push:
    branches:
      - develop/1.0.0
    paths:
      - docs/releases/v1.0.0-beta.1.md

permissions:
  contents: write

concurrency:
  group: itomiscan-publish-v1.0.0-beta.1
  cancel-in-progress: false

jobs:
  prerelease:
    name: Verify and publish prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'tojollinor/ItomiScan' && github.ref == 'refs/heads/develop/1.0.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install lightweight GUI testing packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-pil python3-pil.imagetk xvfb xauth
      - name: Python and shell syntax
        run: |
          python3 -m compileall -q app.py itomiscan tests
          find . -maxdepth 2 -name '*.sh' -type f -print0 | xargs -0 -r -n1 bash -n
      - name: All headless tests in isolated processes
        run: |
          set -euo pipefail
          for test in tests/test_*.py; do
            case "$test" in *test_gui_smoke.py|*test_touch_ui.py) continue ;; esac
            timeout --signal=TERM --kill-after=10s 180s env PYTHONPATH=. python3 -u -m unittest discover -s tests -p "$(basename "$test")" -v
          done
      - name: GUI regression tests
        run: |
          timeout --signal=TERM --kill-after=10s 180s xvfb-run -a env PYTHONPATH=. python3 -u -m unittest discover -s tests -p test_gui_smoke.py -v
          timeout --signal=TERM --kill-after=10s 180s xvfb-run -a env PYTHONPATH=. python3 -u -m unittest discover -s tests -p test_touch_ui.py -v
      - name: Verify prerelease notes and tag uniqueness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s docs/releases/v1.0.0-beta.1.md
          test "$(git branch --show-current)" = "develop/1.0.0"
          if gh release view v1.0.0-beta.1 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Existing release found; do not overwrite."
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" refs/tags/v1.0.0-beta.1 >/dev/null 2>&1; then
            echo "Existing tag found; do not overwrite."
            exit 1
          fi
      - name: Publish first beta (not Stable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0-beta.1 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "ItomiScan v1.0.0 Beta 1" \
            --notes-file docs/releases/v1.0.0-beta.1.md \
            --prerelease \
            --verify-tag
